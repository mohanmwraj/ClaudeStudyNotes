AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DOP-C02 lab 01 - a CodeBuild project that reads a Secrets Manager secret at build start,
  publishes a JUnit test report, and notifies SNS (via EventBridge) when a build fails.

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that receives build-failure notifications (confirm the subscription email).

Resources:
  LabSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dop-lab-01/db
      Description: Lab secret read by CodeBuild through the buildspec env.secrets-manager block
      GenerateSecretString:
        SecretStringTemplate: '{"username": "app"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dop-lab-01-codebuild-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/dop-lab-01-build*
              - Sid: ReadOnlyThisSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref LabSecret
              - Sid: TestReports
                Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                Resource: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/dop-lab-01-build-*

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: dop-lab-01-build
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
      TimeoutInMinutes: 10
      Source:
        Type: NO_SOURCE
        BuildSpec: !Sub |
          version: 0.2
          env:
            secrets-manager:
              DB_PASSWORD: "${LabSecret}:password"
          phases:
            build:
              commands:
                - echo "The secret is masked in this log - $DB_PASSWORD"
                - echo "Secret length is $(printf %s "$DB_PASSWORD" | wc -c) characters"
                - mkdir -p reports
                - printf '<testsuite name="lab" tests="2" failures="0"><testcase classname="lab" name="secret_present"/><testcase classname="lab" name="exit_code_zero"/></testsuite>' > reports/junit.xml
                - test -n "$DB_PASSWORD"
          reports:
            unit:
              files:
                - junit.xml
              base-directory: reports
              file-format: JUNITXML

  FailureTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dop-lab-01-build-failures
      Subscription:
        - Protocol: email
          Endpoint: !Ref NotificationEmail

  FailureTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref FailureTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref FailureTopic

  BuildFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dop-lab-01-build-failed
      Description: P1 in practice - react to the native CodeBuild state-change event, no polling
      State: ENABLED
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - CodeBuild Build State Change
        detail:
          build-status:
            - FAILED
          project-name:
            - !Ref BuildProject
      Targets:
        - Id: notify
          Arn: !Ref FailureTopic

Outputs:
  ProjectName:
    Value: !Ref BuildProject
  SecretArn:
    Value: !Ref LabSecret
