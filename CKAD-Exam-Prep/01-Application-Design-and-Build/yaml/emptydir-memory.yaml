# Memory-backed emptyDir (tmpfs): very fast, never written to disk, wiped with the pod - and every byte
# written counts against the writing container's MEMORY limit. Always pair it with sizeLimit + memory limits.
# kubectl apply -f emptydir-memory.yaml && kubectl exec emptydir-memory -- df -h /cache    # Filesystem: tmpfs
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-memory
  labels:
    app: emptydir-memory
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "df -h /cache; sleep 3600"]
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi                # tmpfs usage is charged here -> OOMKilled if exceeded
    volumeMounts:
    - name: cache
      mountPath: /cache
  volumes:
  - name: cache
    emptyDir:
      medium: Memory                 # "" (default) = node disk; "Memory" = tmpfs
      sizeLimit: 64Mi                # tmpfs size derives from this (without it: node allocatable memory)
