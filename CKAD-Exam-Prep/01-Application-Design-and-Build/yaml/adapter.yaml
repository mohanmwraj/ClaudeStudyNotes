# Adapter pattern: convert the app's native output into the format the platform expects
# (here: "key=value" log lines in a file -> JSON lines on stdout for a log pipeline).
# The app stays untouched; only the adapter knows both formats.
# kubectl apply -f adapter.yaml && kubectl logs adapter-demo -c adapter -f
apiVersion: v1
kind: Pod
metadata:
  name: adapter-demo
  labels:
    app: adapter-demo
spec:
  containers:
  - name: app                        # "legacy" app with its own log format, written to a file
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      i=0
      while true; do
        i=$((i+1))
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) level=INFO requests=$i latency_ms=$((i % 50))" >> /var/log/app/raw.log
        sleep 5
      done
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  - name: adapter                    # reads the raw format, emits one JSON object per line
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      tail -n +1 -F /var/log/app/raw.log | while read -r ts level reqs lat; do
        echo "{\"time\":\"$ts\",\"level\":\"${level#level=}\",\"requests\":${reqs#requests=},\"latency_ms\":${lat#latency_ms=}}"
      done
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
      readOnly: true
  volumes:
  - name: logs
    emptyDir: {}
