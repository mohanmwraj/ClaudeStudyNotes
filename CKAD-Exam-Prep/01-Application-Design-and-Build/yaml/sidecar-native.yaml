# Native sidecar (GA v1.33; beta and on by default since v1.29): an init container with restartPolicy: Always.
# - starts before the app containers; with a startupProbe the next container waits until it succeeds
# - keeps running for the pod's lifetime and is restarted on its own if it exits
# - supports startup/readiness/liveness probes; its readiness counts toward pod readiness
# - is stopped AFTER the app containers on shutdown (reverse declaration order)
# kubectl apply -f sidecar-native.yaml
# kubectl get pod native-sidecar          # READY 2/2 (native sidecars are counted)
# kubectl logs native-sidecar -c log-shipper -f
apiVersion: v1
kind: Pod
metadata:
  name: native-sidecar
  labels:
    app: native-sidecar
spec:
  initContainers:
  - name: log-shipper
    image: busybox:1.36
    restartPolicy: Always            # the one field that turns an init container into a sidecar
    command: ["sh", "-c", "touch /var/log/app/app.log; tail -n +1 -F /var/log/app/app.log"]
    startupProbe:                    # the app container is started only after this succeeds
      exec:
        command: ["test", "-f", "/var/log/app/app.log"]
      periodSeconds: 2
      failureThreshold: 10
    readinessProbe:
      exec:
        command: ["test", "-f", "/var/log/app/app.log"]
      periodSeconds: 10
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"$(date) request $i\" >> /var/log/app/app.log; sleep 3; done"]
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  volumes:
  - name: logs
    emptyDir: {}
