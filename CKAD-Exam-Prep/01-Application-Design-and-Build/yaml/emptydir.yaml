# emptyDir: scratch space shared by the containers of ONE pod.
# Created empty when the pod lands on a node, survives container restarts, deleted when the pod is removed.
# kubectl apply -f emptydir.yaml
# kubectl exec emptydir-demo -c web -- curl -s localhost/index.html     # written by the other container
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels:
    app: emptydir-demo
spec:
  containers:
  - name: writer
    image: busybox:1.36
    command: ["sh", "-c", "while true; do date > /data/index.html; sleep 5; done"]
    volumeMounts:
    - name: shared
      mountPath: /data
  - name: web
    image: nginx:1.27
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared                   # same volume, different mount path per container is fine
      mountPath: /usr/share/nginx/html
      readOnly: true
  volumes:
  - name: shared
    emptyDir:
      sizeLimit: 50Mi                # disk-backed: the kubelet evicts the pod if usage exceeds the limit
