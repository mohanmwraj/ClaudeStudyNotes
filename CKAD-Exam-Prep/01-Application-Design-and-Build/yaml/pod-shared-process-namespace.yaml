# shareProcessNamespace: every container sees every process of the pod (PID 1 is the pause container).
# Use it to signal another container (e.g. reload config) or to read its filesystem via /proc/<pid>/root.
# kubectl apply -f pod-shared-process-namespace.yaml
# kubectl exec shared-pid -c shell -- ps ax                    # nginx master + workers are visible
# kubectl exec -it shared-pid -c shell -- sh
#   kill -HUP <nginx-master-pid>                               # reload nginx from the other container
#   head /proc/<nginx-master-pid>/root/etc/nginx/nginx.conf    # read nginx's filesystem
apiVersion: v1
kind: Pod
metadata:
  name: shared-pid
  labels:
    app: shared-pid
spec:
  shareProcessNamespace: true        # pod-level switch (default false)
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
  - name: shell
    image: busybox:1.36
    command: ["sleep", "3600"]
    securityContext:
      capabilities:
        add: ["SYS_PTRACE"]          # lets this container inspect processes owned by other users/containers
    stdin: true
    tty: true
