# Job: run pods until a number of them SUCCEED. Fixed completion count with parallelism.
# Generate:  kubectl create job batch-job --image=busybox:1.36 --dry-run=client -o yaml -- sh -c 'echo hi' > job.yaml
# kubectl apply -f job.yaml && kubectl get job batch-job -w
# kubectl get pods -l job-name=batch-job ; kubectl logs job/batch-job
# kubectl wait --for=condition=complete job/batch-job --timeout=120s
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-job
spec:
  completions: 3                     # successful pods required (default 1)
  parallelism: 2                     # max pods running at the same time (default 1)
  backoffLimit: 4                    # failed retries before the Job is Failed (default 6)
  activeDeadlineSeconds: 120         # wall-clock limit for the whole Job; takes precedence over backoffLimit
  ttlSecondsAfterFinished: 600       # delete the Job and its pods 10 min after it finishes (unset = keep)
  template:
    metadata:
      labels:
        app: batch-job
    spec:
      restartPolicy: Never           # Job pods: Never or OnFailure only (Always is rejected)
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo \"processing on $(hostname)\"; sleep 5; echo done"]
