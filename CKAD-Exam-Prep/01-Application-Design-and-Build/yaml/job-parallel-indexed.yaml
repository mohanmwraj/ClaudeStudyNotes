# Indexed Job: every pod gets a unique completion index 0..completions-1 (static sharding of work).
# The index is available as env JOB_COMPLETION_INDEX, as the annotation and label
# batch.kubernetes.io/job-completion-index, and in the pod hostname (<job-name>-<index>).
# kubectl apply -f job-parallel-indexed.yaml
# kubectl get pods -l job-name=indexed-job -L batch.kubernetes.io/job-completion-index
# kubectl logs -l job-name=indexed-job --prefix        # with -l, logs default to the last 10 lines per pod
apiVersion: batch/v1
kind: Job
metadata:
  name: indexed-job
spec:
  completionMode: Indexed            # NonIndexed (default) | Indexed
  completions: 5                     # indexes 0..4, each must succeed once
  parallelism: 3
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -- alpha bravo charlie delta echo
          shift "$JOB_COMPLETION_INDEX"
          echo "pod $(hostname) has index $JOB_COMPLETION_INDEX and processes item '$1'"
