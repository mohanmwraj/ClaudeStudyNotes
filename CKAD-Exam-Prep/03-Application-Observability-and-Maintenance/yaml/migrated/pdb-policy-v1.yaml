# FIXED - policy/v1 PodDisruptionBudget migrated from ../deprecated/pdb-v1beta1.yaml
# Change: apiVersion. Watch out: an empty selector {} now selects ALL Pods in the namespace.
# Apply:  kubectl apply -f pdb-policy-v1.yaml
# Same thing imperatively:
#   kubectl create poddisruptionbudget legacy-web-pdb --selector=app=legacy-web --min-available=2
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: legacy-web-pdb
spec:
  minAvailable: 2                # or maxUnavailable - set exactly one of the two
  selector:
    matchLabels:
      app: legacy-web
