# BROKEN ON PURPOSE - a Service with no working endpoints
# Bug 1: Service selector app=web-api does not match the Pod label app=webapi -> no endpoints at all
# Bug 2: targetPort 8080, but nginx listens on 80 -> "connection refused" once bug 1 is fixed
# See:  kubectl get endpointslices -l kubernetes.io/service-name=web-api   -> ENDPOINTS <unset>
#       kubectl describe svc web-api | grep -E "Selector|TargetPort|Endpoints"
#       kubectl get pods --show-labels
#       kubectl run tmp --rm -it --image=busybox:1.36 --restart=Never -- wget -qO- -T 2 http://web-api
# Fix:  kubectl patch svc web-api -p '{"spec":{"selector":{"app":"webapi"},"ports":[{"port":80,"targetPort":80}]}}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi
  labels:
    app: webapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapi
  template:
    metadata:
      labels:
        app: webapi
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-api
spec:
  selector:
    app: web-api               # BUG 1: Pods are labelled app=webapi
  ports:
  - port: 80
    targetPort: 8080           # BUG 2: the container listens on 80
