# LEGACY - DO NOT APPLY. Ingress in networking.k8s.io/v1beta1 (extensions/v1beta1 looked the same),
# no longer served since v1.22.
# Problems: removed apiVersion; flat serviceName/servicePort backends; no pathType;
#           spec.backend instead of spec.defaultBackend; class set by a deprecated annotation.
# Fixed version: ../migrated/ingress-v1.yaml
apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: shop
  annotations:
    kubernetes.io/ingress.class: nginx     # deprecated -> spec.ingressClassName in v1
spec:
  backend:                                 # -> spec.defaultBackend in v1
    serviceName: default-http
    servicePort: 80
  tls:
  - hosts:
    - shop.example.com
    secretName: shop-tls
  rules:
  - host: shop.example.com
    http:
      paths:
      - path: /api
        backend:
          serviceName: api-svc             # -> backend.service.name
          servicePort: 8080                # numeric -> backend.service.port.number
      - path: /
        backend:
          serviceName: web-svc
          servicePort: http                # string  -> backend.service.port.name
