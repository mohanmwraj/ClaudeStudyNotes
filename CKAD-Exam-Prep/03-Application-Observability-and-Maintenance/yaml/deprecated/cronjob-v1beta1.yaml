# LEGACY - DO NOT APPLY. CronJob in batch/v1beta1, no longer served since v1.25.
# Problem: removed apiVersion only - the batch/v1 schema is the same ("no notable changes").
# Fixed version: ../migrated/cronjob-batch-v1.yaml
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: report
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: report
            image: busybox:1.36
            command: ["sh", "-c", "date; echo generating report"]
