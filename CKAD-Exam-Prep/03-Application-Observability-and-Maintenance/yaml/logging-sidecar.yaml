# Sidecar log streaming: the app writes to a FILE on a shared emptyDir (invisible to kubectl logs);
# a sidecar tails that file to its own stdout, so `kubectl logs -c <sidecar>` and node log agents see it.
# Apply:  kubectl apply -f logging-sidecar.yaml
# Read:   kubectl logs app-classic-sidecar -c log-streamer -f
#         kubectl logs app-native-sidecar -c log-streamer --tail=5
#         kubectl logs app-native-sidecar --all-containers --prefix
#
# 1) Classic sidecar: a second entry in spec.containers (works on every version; no start/stop ordering)
apiVersion: v1
kind: Pod
metadata:
  name: app-classic-sidecar
  labels:
    app: log-demo
    variant: classic
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      i=0
      while true; do
        echo "$(date) INFO request $i served" >> /var/log/app/app.log
        i=$((i+1))
        sleep 2
      done
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  - name: log-streamer
    image: busybox:1.36
    command: ["sh", "-c", "tail -n+1 -F /var/log/app/app.log"]   # -F keeps retrying until the file exists
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
      readOnly: true
  volumes:
  - name: logs
    emptyDir: {}
---
# 2) Native sidecar (GA v1.33): an initContainers entry with restartPolicy: Always.
#    Starts before 'app', keeps running, and is stopped only after 'app' exits -> no lost lines at shutdown,
#    and it does not block Job completion.
apiVersion: v1
kind: Pod
metadata:
  name: app-native-sidecar
  labels:
    app: log-demo
    variant: native
spec:
  initContainers:
  - name: log-streamer
    image: busybox:1.36
    restartPolicy: Always
    command: ["sh", "-c", "tail -n+1 -F /var/log/app/app.log"]
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
      readOnly: true
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      i=0
      while true; do
        echo "$(date) INFO request $i served" >> /var/log/app/app.log
        i=$((i+1))
        sleep 2
      done
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  volumes:
  - name: logs
    emptyDir: {}
