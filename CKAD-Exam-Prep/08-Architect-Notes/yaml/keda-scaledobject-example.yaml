# keda-scaledobject-example.yaml
# Demonstrates: event-driven autoscaling with KEDA, including scale to zero, for a queue worker
#   in namespace "shop": Deployment "orders-worker" + NetworkPolicy (egress to the broker)
#   + TriggerAuthentication + ScaledObject scaling 0..30 replicas on RabbitMQ queue length.
# REQUIRES: KEDA installed in the cluster (CRDs in API group keda.sh, kinds ScaledObject and
#   TriggerAuthentication), see https://keda.sh/docs/latest/deploy/  (KEDA 2.21 is current as of Oct 2026)
#   and a Secret "rabbitmq-conn" with key "host" = amqp://user:pass@rabbitmq.messaging.svc:5672/vhost
#   - ideally synced from your secret manager (External Secrets Operator), never committed to Git:
#   kubectl -n shop create secret generic rabbitmq-conn --from-literal=host='amqp://...'
# Do NOT also create an HPA for this Deployment: KEDA creates and owns one
# (keda-hpa-orders-worker) for 1..N and handles 0 <-> 1 itself.
# Apply (after namespace-baseline.yaml):
#   kubectl apply -f keda-scaledobject-example.yaml
# Verify:
#   kubectl -n shop get scaledobject orders-worker    # READY / ACTIVE columns
#   kubectl -n shop get hpa                           # keda-hpa-orders-worker
#   kubectl -n shop get deploy orders-worker -w       # 0 -> N -> 0 as the queue fills and drains
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: shop
  labels:
    app.kubernetes.io/name: orders-worker
    app.kubernetes.io/part-of: shop
spec:
  # No replicas: KEDA (through its HPA) owns the count; 0 is a valid steady state.
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-worker
        app.kubernetes.io/part-of: shop
        tier: worker
    spec:
      automountServiceAccountToken: false
      # Scale-in sends SIGTERM to busy workers: finish (or nack) the current message within
      # this window. Make processing idempotent; for multi-minute work prefer a KEDA ScaledJob.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        # Stand-in so the manifest runs anywhere; replace with your consumer image (by digest).
        image: busybox:1.36
        command: ["sh", "-c", "echo 'consuming orders...'; while true; do sleep 30; done"]
        env:
        - name: QUEUE_NAME
          value: orders
        - name: RABBITMQ_URL_FILE        # the app reads the credential from a file, not from env
          value: /var/run/secrets/rabbitmq/host
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: rabbitmq-conn
          mountPath: /var/run/secrets/rabbitmq
          readOnly: true
      volumes:
      - name: rabbitmq-conn
        secret:
          secretName: rabbitmq-conn      # updated in place on rotation (no subPath)
---
# The namespace baseline denies all egress; the worker must reach the broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-worker-egress
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: messaging
    ports:
    - protocol: TCP
      port: 5672
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-conn
  namespace: shop
spec:
  secretTargetRef:               # maps trigger parameter "host" to a key of an existing Secret
  - parameter: host
    name: rabbitmq-conn
    key: host
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: orders-worker
  namespace: shop
spec:
  scaleTargetRef:
    name: orders-worker          # Deployment in the same namespace (apps/v1 Deployment by default)
  minReplicaCount: 0             # scale to zero when the queue is empty (KEDA default is 0)
  maxReplicaCount: 30            # protect the broker and the downstream database
  pollingInterval: 15            # seconds between trigger checks (default 30)
  cooldownPeriod: 300            # wait after the last active trigger before going 1 -> 0 (default 300)
  fallback:                      # scaler errors 3 times in a row -> hold 2 replicas instead of guessing
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:                  # same schema as HPA autoscaling/v2 behavior
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
          - type: Percent
            value: 50
            periodSeconds: 60
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: orders
      mode: QueueLength          # target number of messages per replica
      value: "20"                # 200 ready messages -> 10 replicas
      activationValue: "0"       # any message (> 0) wakes the worker up from zero
    authenticationRef:
      name: rabbitmq-conn
