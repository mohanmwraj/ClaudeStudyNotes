# Demonstrates: Secrets written with plain-text `stringData` (the API server base64-encodes it
# into `data`), a file-style key, and the built-in basic-auth and ssh-auth types.
# Apply:   kubectl apply -f secret-stringdata.yaml
# Verify:  kubectl get secret app-api-keys -o yaml        # only `data` (base64) comes back
#          kubectl get secret app-api-keys -o go-template='{{.data.API_KEY | base64decode}}{{"\n"}}'
# stringData is write-only and wins over `data` if the same key appears in both.
apiVersion: v1
kind: Secret
metadata:
  name: app-api-keys
type: Opaque
stringData:
  API_KEY: demo-key-123                  # plain text - no base64 needed
  API_ENDPOINT: https://api.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: app-config-file
type: Opaque
stringData:
  config.yaml: |                         # file-style key: mount the Secret as a volume
    endpoint: https://api.example.com
    timeoutSeconds: 5
    token: demo-token-abc
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-demo
type: kubernetes.io/basic-auth           # requires at least one of: username, password
stringData:
  username: app-user
  password: ChangeMe-123
---
apiVersion: v1
kind: Secret
metadata:
  name: ssh-key-demo
type: kubernetes.io/ssh-auth             # requires the key ssh-privatekey
stringData:
  ssh-privatekey: |
    PLACEHOLDER - paste a real private key here, or create the Secret with:
    kubectl create secret generic ssh-key-demo --type=kubernetes.io/ssh-auth --from-file=ssh-privatekey=$HOME/.ssh/id_ed25519
