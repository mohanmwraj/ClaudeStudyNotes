# Demonstrates: a ClusterRoleBinding - grants a ClusterRole in EVERY namespace (and on
# cluster-scoped resources) to a group and to a ServiceAccount.
# Prereq:  kubectl apply -f clusterrole.yaml
#          kubectl create namespace monitoring && kubectl create serviceaccount node-exporter -n monitoring
# Apply:   kubectl apply -f clusterrolebinding.yaml
# Imperative equivalent:
#   kubectl create clusterrolebinding cluster-inspector-binding --clusterrole=cluster-inspector \
#     --group=ops-team --serviceaccount=monitoring:node-exporter
# Verify:  kubectl auth can-i list nodes --as=system:serviceaccount:monitoring:node-exporter   # yes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-inspector-binding        # ClusterRoleBindings have no namespace
subjects:
- kind: Group
  name: ops-team
  apiGroup: rbac.authorization.k8s.io
- kind: ServiceAccount
  name: node-exporter
  namespace: monitoring                  # REQUIRED for ServiceAccount subjects
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole                      # a ClusterRoleBinding can only reference a ClusterRole
  name: cluster-inspector
