# Demonstrates: Secrets as files - selected keys with restrictive permissions (items +
# defaultMode 0400) and a whole Secret mounted as a directory.
# Prereq:  kubectl apply -f secret-opaque.yaml -f secret-stringdata.yaml
# Apply:   kubectl apply -f pod-secret-volume.yaml
# Verify:  kubectl exec secret-volume-demo -- ls -l /etc/db/      # symlinks to ..data/ (tmpfs)
#          kubectl exec secret-volume-demo -- cat /etc/db/db-password
#          kubectl exec secret-volume-demo -- cat /etc/app/config.yaml
# Files are decoded (plain text), live on tmpfs (never written to node disk), and refresh
# automatically when the Secret changes (except subPath mounts).
apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: db-creds
      mountPath: /etc/db
      readOnly: true
    - name: app-config
      mountPath: /etc/app
      readOnly: true
  volumes:
  - name: db-creds
    secret:
      secretName: db-credentials         # NOTE: "secretName" here (configMap volumes use "name")
      defaultMode: 0400                  # owner read-only (octal); default is 0644
      items:                             # only these keys are projected
      - key: username
        path: db-username
      - key: password
        path: db-password
  - name: app-config
    secret:
      secretName: app-config-file        # every key -> one file (config.yaml)
      optional: false
