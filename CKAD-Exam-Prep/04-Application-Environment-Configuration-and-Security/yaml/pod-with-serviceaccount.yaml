# Demonstrates: running a Pod and a Deployment as a specific ServiceAccount.
# Prereq:  kubectl apply -f serviceaccount.yaml      (creates dev/app-sa)
# Apply:   kubectl apply -f pod-with-serviceaccount.yaml
# Imperative for an existing Deployment:  kubectl set serviceaccount deploy/web -n dev app-sa
#   (a running Pod's SA cannot be changed - delete and recreate the Pod instead)
# Verify:  kubectl get pod sa-demo -n dev -o jsonpath='{.spec.serviceAccountName}{"\n"}'
#          kubectl exec -n dev sa-demo -- ls /var/run/secrets/kubernetes.io/serviceaccount
#          # -> ca.crt  namespace  token
apiVersion: v1
kind: Pod
metadata:
  name: sa-demo
  namespace: dev
spec:
  serviceAccountName: app-sa             # NOT the deprecated "serviceAccount" field
  automountServiceAccountToken: true     # Pod-level setting wins over the SA-level setting
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: app-sa         # changing this field triggers a rollout
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
