# Demonstrates: Secrets as environment variables - single keys (secretKeyRef) and all keys
# (envFrom secretRef, with a prefix).
# Prereq:  kubectl apply -f secret-opaque.yaml -f secret-stringdata.yaml
# Apply:   kubectl apply -f pod-secret-env.yaml
# Imperative alternative on a Deployment:  kubectl set env deploy/<name> --from=secret/db-credentials
# Verify:  kubectl exec secret-env-demo -- printenv DB_USER API_KEY
# Env vars do not update when the Secret changes, and leak easily (crash dumps, `env` output,
# child processes) - prefer volumes for sensitive values in production.
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo connecting as $DB_USER to $DB_HOST; sleep 3600"]
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: password
    - name: DB_HOST
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: host
          optional: false                # default: missing Secret/key -> CreateContainerConfigError
    envFrom:
    - secretRef:
        name: app-api-keys               # API_KEY and API_ENDPOINT become env vars
    - prefix: BASIC_                     # BASIC_username, BASIC_password
      secretRef:
        name: basic-auth-demo
