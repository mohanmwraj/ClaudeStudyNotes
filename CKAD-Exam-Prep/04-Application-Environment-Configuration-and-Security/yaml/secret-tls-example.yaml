# Demonstrates: the structure of a kubernetes.io/tls Secret (keys tls.crt and tls.key).
# !!! PLACEHOLDER DATA !!! The values below are base64 of the text
# "REPLACE-ME-with-base64-of-your-tls.crt-PEM" / "...tls.key-PEM" - NOT a usable certificate.
# The API server only checks that both keys exist, so this applies, but TLS will not work.
#
# Make a real one (exam way):
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=app.example.com"
#   kubectl create secret tls app-tls --cert=tls.crt --key=tls.key
# Apply (placeholder only):  kubectl apply -f secret-tls-example.yaml
# Verify a real one:  kubectl get secret app-tls -o jsonpath='{.data.tls\.crt}' | base64 -d \
#                       | openssl x509 -noout -subject -enddate      # note the escaped dot: tls\.crt
# Consumers: Ingress spec.tls[].secretName, Gateway listeners, or mount as a volume.
apiVersion: v1
kind: Secret
metadata:
  name: app-tls
type: kubernetes.io/tls
data:
  tls.crt: UkVQTEFDRS1NRS13aXRoLWJhc2U2NC1vZi15b3VyLXRscy5jcnQtUEVN   # PLACEHOLDER
  tls.key: UkVQTEFDRS1NRS13aXRoLWJhc2U2NC1vZi15b3VyLXRscy5rZXktUEVN   # PLACEHOLDER
