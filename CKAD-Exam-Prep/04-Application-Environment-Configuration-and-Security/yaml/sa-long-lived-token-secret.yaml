# Demonstrates: a manually created, long-lived (non-expiring) ServiceAccount token Secret.
# Since v1.24 Kubernetes no longer auto-creates these; prefer short-lived tokens
# (`kubectl create token app-sa -n dev --duration=1h`) and use this only for legacy clients.
# Prereq:  kubectl apply -f serviceaccount.yaml      (the SA must exist FIRST)
# Apply:   kubectl apply -f sa-long-lived-token-secret.yaml
# Verify:  kubectl get secret app-sa-token -n dev            # DATA = 3 (ca.crt, namespace, token)
#          kubectl get secret app-sa-token -n dev -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: app-sa-token
  namespace: dev
  annotations:
    kubernetes.io/service-account.name: app-sa   # the token controller fills in data.token for this SA
type: kubernetes.io/service-account-token
# No data needed: the control plane populates token, ca.crt and namespace.
# Deleting this Secret revokes the token; it never expires on its own.
