# Demonstrates: custom resources (instances) of the CronTab CRD from crd-crontab.yaml.
# Prereq: kubectl apply -f crd-crontab.yaml   (the CRD must exist first, or apply fails with
#         'no matches for kind "CronTab" in version "stable.example.com/v1"')
# Apply:   kubectl apply -f cr-crontab-instance.yaml
# Verify:  kubectl get crontabs            (or: kubectl get ct / kubectl get crontabs.stable.example.com)
#          kubectl get ct nightly-report -o yaml      # replicas defaulted to 1 by the schema
#          kubectl scale ct hourly-cleanup --replicas=3   # works because of the scale subresource
apiVersion: stable.example.com/v1        # <group>/<version> from the CRD
kind: CronTab                            # spec.names.kind from the CRD
metadata:
  name: hourly-cleanup
  labels:
    app: cleanup
spec:
  cronSpec: "0 * * * *"
  image: busybox:1.36
  replicas: 2
---
apiVersion: stable.example.com/v1
kind: CronTab
metadata:
  name: nightly-report
spec:
  cronSpec: "30 2 * * *"
  image: busybox:1.36                    # replicas omitted -> defaulted to 1 by the API server
