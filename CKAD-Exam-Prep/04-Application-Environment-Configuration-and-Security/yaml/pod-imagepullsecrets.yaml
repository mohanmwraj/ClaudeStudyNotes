# Demonstrates: pulling from a private registry - a docker-registry Secret, referenced from a
# Pod (imagePullSecrets) or attached to a ServiceAccount so every Pod using it inherits it.
# Create the Secret the exam way instead of using the placeholder below:
#   kubectl create secret docker-registry regcred --docker-server=registry.example.com \
#     --docker-username=demo-user --docker-password='REPLACE-ME' --docker-email=demo@example.com
# Apply:   kubectl apply -f pod-imagepullsecrets.yaml
# Verify:  kubectl get pod private-image-demo -o jsonpath='{.spec.imagePullSecrets}{"\n"}'
#          kubectl describe pod private-image-demo     # Events: Pulled / ErrImagePull / ImagePullBackOff
# NOTE: registry.example.com is a placeholder - with it the Pod ends in ImagePullBackOff.
apiVersion: v1
kind: Secret
metadata:
  name: regcred
type: kubernetes.io/dockerconfigjson     # key must be .dockerconfigjson and hold valid JSON
stringData:
  .dockerconfigjson: |
    {"auths":{"registry.example.com":{"username":"demo-user","password":"REPLACE-ME","email":"demo@example.com","auth":"ZGVtby11c2VyOlJFUExBQ0UtTUU="}}}
# "auth" = base64 of "username:password" (here demo-user:REPLACE-ME)
---
apiVersion: v1
kind: Pod
metadata:
  name: private-image-demo
spec:
  imagePullSecrets:                      # pod-level list of Secret names (same namespace)
  - name: regcred
  containers:
  - name: app
    image: registry.example.com/team/private-app:1.0.0   # placeholder private image
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: private-registry-sa
imagePullSecrets:                        # Pods using this SA get regcred added at admission
- name: regcred
# Same for the namespace's default SA:
#   kubectl patch serviceaccount default -p '{"imagePullSecrets":[{"name":"regcred"}]}'
