# Demonstrates: an Opaque Secret written with base64 `data`, and an immutable Secret.
# Apply:   kubectl apply -f secret-opaque.yaml
# Imperative equivalent (kubectl does the base64 for you):
#   kubectl create secret generic db-credentials --from-literal=username=admin \
#     --from-literal=password='S3cr3t-Passw0rd' --from-literal=host=db.internal.example.com \
#     --from-literal=port=5432
# Encode by hand WITHOUT a trailing newline:  echo -n 'admin' | base64   -> YWRtaW4=
#                                (echo 'admin' | base64 -> YWRtaW4K  = "admin\n", a classic bug)
# Verify:  kubectl get secret db-credentials -o jsonpath='{.data.password}' | base64 -d; echo
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque                             # default type for arbitrary key/value data
data:                                    # values MUST be base64-encoded
  username: YWRtaW4=                     # admin
  password: UzNjcjN0LVBhc3N3MHJk         # S3cr3t-Passw0rd
  host: ZGIuaW50ZXJuYWwuZXhhbXBsZS5jb20=  # db.internal.example.com
  port: NTQzMg==                         # 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-v1
type: Opaque
immutable: true                          # cannot be changed - delete and recreate to rotate
data:
  password: UzNjcjN0LVBhc3N3MHJk
