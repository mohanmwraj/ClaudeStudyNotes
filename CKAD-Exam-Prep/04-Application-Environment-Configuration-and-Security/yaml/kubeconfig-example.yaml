# Demonstrates: the structure of a kubeconfig file (~/.kube/config) - clusters, users,
# contexts and current-context. This is CLIENT configuration, not an API object:
# do NOT `kubectl apply` it. Use it with:  kubectl --kubeconfig=kubeconfig-example.yaml config get-contexts
# All credential values are PLACEHOLDERS.
# Build one imperatively:
#   kubectl config set-cluster ckad-lab --server=https://192.168.56.10:6443 \
#     --certificate-authority=ca.crt --embed-certs=true
#   kubectl config set-credentials jane --client-certificate=jane.crt --client-key=jane.key --embed-certs=true
#   kubectl config set-context jane@ckad-lab --cluster=ckad-lab --user=jane --namespace=dev
#   kubectl config use-context jane@ckad-lab
apiVersion: v1
kind: Config
current-context: jane@ckad-lab           # context used when --context is not given
clusters:                                # WHERE: API server URL + CA to trust
- name: ckad-lab
  cluster:
    server: https://192.168.56.10:6443
    certificate-authority-data: PLACEHOLDER-BASE64-CA-CERT
users:                                   # WHO: credentials (cert/key, token, or exec plugin)
- name: jane                             # X.509 client cert: CN=username, O=groups
  user:
    client-certificate-data: PLACEHOLDER-BASE64-CLIENT-CERT
    client-key-data: PLACEHOLDER-BASE64-CLIENT-KEY
- name: ci-bot                           # bearer token, e.g. from `kubectl create token ci-bot`
  user:
    token: PLACEHOLDER-JWT
- name: sso-user                         # exec credential plugin (OIDC, cloud IAM, ...)
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      command: kubectl
      args: ["oidc-login", "get-token", "--oidc-issuer-url=https://issuer.example.com", "--oidc-client-id=kubernetes"]
      interactiveMode: IfAvailable       # required in client.authentication.k8s.io/v1
contexts:                                # context = cluster + user (+ default namespace)
- name: jane@ckad-lab
  context:
    cluster: ckad-lab
    user: jane
    namespace: dev                       # default namespace for this context
- name: ci@ckad-lab
  context:
    cluster: ckad-lab
    user: ci-bot
    namespace: ci
preferences: {}
