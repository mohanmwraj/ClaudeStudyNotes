# Demonstrates: ServiceAccounts - a plain one, and one that disables token automount and
# carries an imagePullSecret that is injected into every Pod using it.
# Prereq:  kubectl create namespace dev
# Apply:   kubectl apply -f serviceaccount.yaml
# Imperative equivalent:  kubectl create serviceaccount app-sa -n dev
#   (then: kubectl patch sa build-bot -n dev -p '{"imagePullSecrets":[{"name":"regcred"}]}')
# Verify:  kubectl get sa -n dev
#          kubectl describe sa build-bot -n dev
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-bot
  namespace: dev
automountServiceAccountToken: false      # Pods using this SA get no API token mounted
                                         # (a Pod-level automountServiceAccountToken overrides this)
imagePullSecrets:                        # added to Pods that use this SA (ServiceAccount admission plugin)
- name: regcred                          # a kubernetes.io/dockerconfigjson Secret in the same namespace
