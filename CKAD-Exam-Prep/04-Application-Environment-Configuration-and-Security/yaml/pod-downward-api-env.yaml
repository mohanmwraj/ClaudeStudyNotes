# Demonstrates: Downward API as environment variables - every fieldRef path that works for env,
# plus resourceFieldRef with divisors.
# Apply:   kubectl apply -f pod-downward-api-env.yaml
# Verify:  kubectl logs downward-env-demo
#          kubectl exec downward-env-demo -- printenv POD_IP NODE_NAME CPU_LIMIT_MILLICORES
# Env values are captured at container start - later label/annotation changes are NOT reflected
# (use a downwardAPI volume for that: pod-downward-api-volume.yaml).
apiVersion: v1
kind: Pod
metadata:
  name: downward-env-demo
  labels:
    app: downward-demo
  annotations:
    build: "2026-10-17"
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "env | grep -E '^(POD|NODE|HOST|SA|APP|BUILD|CPU|MEM)_' | sort; sleep 3600"]
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 64Mi
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: APP_LABEL                    # ONE label by key (whole map only via volume)
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['app']
    - name: BUILD_ANNOTATION             # ONE annotation by key
      valueFrom:
        fieldRef:
          fieldPath: metadata.annotations['build']
    - name: NODE_NAME                    # env-only fields from here ...
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: SA_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: POD_IPS                      # dual-stack list, comma-separated
      valueFrom:
        fieldRef:
          fieldPath: status.podIPs
    - name: HOST_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: HOST_IPS
      valueFrom:
        fieldRef:
          fieldPath: status.hostIPs      # ... to here
    - name: CPU_LIMIT_MILLICORES
      valueFrom:
        resourceFieldRef:
          containerName: app             # optional for env (defaults to this container)
          resource: limits.cpu
          divisor: 1m                    # 500m / 1m -> "500"
    - name: CPU_REQUEST_CORES
      valueFrom:
        resourceFieldRef:
          resource: requests.cpu         # divisor defaults to 1 -> 100m is rounded UP to "1"
    - name: MEM_LIMIT_MIB
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi                   # 64Mi / 1Mi -> "64"
