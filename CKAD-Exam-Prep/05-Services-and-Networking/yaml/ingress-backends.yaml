# Demo backends for every ingress-*.yaml file in this folder.
# Each backend is nginx answering ANY path with "<pod-name> <request-uri>", so you can see which
# Service handled a request and which path actually reached it (useful for rewrite tests).
# Apply: kubectl apply -f ingress-backends.yaml
# Services: app-svc:80 (port name http) | api-svc:8080 (port name http) | fallback-svc:80 (port name http)
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-conf
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 "$hostname $request_uri\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d     # replaces the default server config
      volumes:
      - name: conf
        configMap:
          name: echo-conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: conf
        configMap:
          name: echo-conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fallback
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fallback
  template:
    metadata:
      labels:
        app: fallback
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: conf
        configMap:
          name: echo-conf
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
spec:
  selector:
    app: app
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 8080                # Service port 8080 -> container port 80: Ingress backends use 8080 (or name http)
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: fallback-svc
spec:
  selector:
    app: fallback
  ports:
  - name: http
    port: 80
    targetPort: http
