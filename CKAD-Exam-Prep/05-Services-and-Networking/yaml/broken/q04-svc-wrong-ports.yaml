# Practice Q4 setup -- INTENTIONALLY BROKEN. Apply it, then solve the task without reading further.
# kubectl apply -f q04-svc-wrong-ports.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: sn-q4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: sn-q4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - name: web
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: sn-q4
spec:
  selector:
    app: billing
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: billing-named
  namespace: sn-q4
spec:
  selector:
    app: billing
  ports:
  - port: 8080
    targetPort: http
