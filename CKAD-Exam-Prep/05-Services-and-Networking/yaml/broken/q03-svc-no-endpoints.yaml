# Practice Q3 setup -- INTENTIONALLY BROKEN. Apply it, then solve the task without reading further.
# kubectl apply -f q03-svc-no-endpoints.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: sn-q3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: sn-q3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
      tier: backend
  template:
    metadata:
      labels:
        app: orders
        tier: backend
    spec:
      containers:
      - name: orders
        image: nginx:1.27
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: sn-q3
spec:
  selector:
    app: order
    tier: backend
  ports:
  - port: 80
    targetPort: 80
