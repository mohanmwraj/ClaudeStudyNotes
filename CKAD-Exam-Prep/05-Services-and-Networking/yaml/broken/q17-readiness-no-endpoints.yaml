# Practice Q17 setup -- INTENTIONALLY BROKEN. Apply it, then solve the task without reading further.
# kubectl apply -f q17-readiness-no-endpoints.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: sn-q17
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: sn-q17
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: sn-q17
spec:
  selector:
    app: inventory
  ports:
  - name: http
    port: 80
    targetPort: 80
