# LoadBalancer Service: an LB implementation (cloud provider, MetalLB, cloud-provider-kind, ...) provisions
# an external load balancer and writes its address to status.loadBalancer.ingress.
# It ALSO gets a ClusterIP and (by default) a nodePort on every node, so it works as a NodePort Service too.
# Without an LB implementation EXTERNAL-IP stays <pending> forever -- that is not an error in your YAML.
# Prereq: the 'web' Deployment from svc-clusterip.yaml.
# Apply:  kubectl apply -f svc-loadbalancer.yaml
# Check:  kubectl get svc web-lb -w        (EXTERNAL-IP column)
# Imperative: kubectl expose deployment web --name=web-lb --type=LoadBalancer --port=80 --target-port=80
apiVersion: v1
kind: Service
metadata:
  name: web-lb
  # Provider-specific options (internal LB, static IP, ...) go in annotations documented by the provider.
  # spec.loadBalancerIP is deprecated since v1.24.
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
  - name: http
    protocol: TCP
    port: 80                  # port on the external LB and on the ClusterIP
    targetPort: 80
  externalTrafficPolicy: Cluster   # default. Local = keep the client source IP and skip the extra hop,
                                   # but only nodes with a ready local Pod receive traffic (healthCheckNodePort)
  # allocateLoadBalancerNodePorts: false   # skip nodePort allocation when the LB sends traffic straight to Pods
  # loadBalancerClass: example.com/my-lb   # use a non-default LB implementation (immutable once set)
