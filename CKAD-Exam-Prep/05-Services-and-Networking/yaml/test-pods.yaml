# NetworkPolicy lab: 3 namespaces, server Deployments + Services, and labelled busybox client Pods.
# Every netpol-*.yaml file in this folder targets namespace netpol-demo and these labels.
#
#   namespace     labels            servers (Service:port)                clients (busybox, sleep)
#   netpol-demo   team=shop         web:80 (app=web) api:80 (app=api)     frontend (app=frontend)
#                                   db:6379 (app=db)                      intruder (app=intruder)
#   monitoring    team=ops          -                                     prometheus (app=prometheus)
#                                                                         grafana (app=grafana)
#   other         -                 -                                     prometheus (app=prometheus)
#
# Apply:  kubectl apply -f test-pods.yaml
#         kubectl wait --for=condition=Ready pod --all -n netpol-demo --timeout=120s
# Test (HTTP / TCP with short timeouts so a block shows up fast):
#   kubectl -n netpol-demo exec frontend -- wget -qO- --timeout=2 http://api
#   kubectl -n netpol-demo exec frontend -- nc -zv -w 2 db 6379
#   kubectl -n monitoring  exec prometheus -- wget -qO- --timeout=2 http://web.netpol-demo
# Clean:  kubectl delete -f test-pods.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: netpol-demo
  labels:
    team: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    team: ops
---
apiVersion: v1
kind: Namespace
metadata:
  name: other
---
# ---------- servers in netpol-demo ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: netpol-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine      # alpine image: busybox wget/nc available for egress tests
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: netpol-demo
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: netpol-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: backend
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: api                     # busybox httpd: tiny HTTP server that also has wget/nc for egress tests
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /www && echo api-ok > /www/index.html && httpd -f -p 80 -h /www"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: netpol-demo
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: netpol-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        tier: data
    spec:
      containers:
      - name: redis
        image: redis:7.2
        ports:
        - name: redis
          containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: netpol-demo
spec:
  selector:
    app: db
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
---
# ---------- clients ----------
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: netpol-demo
  labels:
    app: frontend
spec:
  terminationGracePeriodSeconds: 1    # busybox sleep ignores SIGTERM; delete fast
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: netpol-demo
  labels:
    app: intruder
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: prometheus
  namespace: other                    # same Pod label, but a namespace WITHOUT team=ops
  labels:
    app: prometheus
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 86400"]
